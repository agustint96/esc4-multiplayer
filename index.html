<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carátula - Agustin Tardella</title>
    <link rel="icon" type="image/png" href="parallax/parallax 9.webp" />
    <!-- El marco del juego (juego.html). Normalmente el juego ocupa toda la
         ventana. Online, al emparejarse, los dos acuerdan un mapa del mismo
         tamaño (ver "El mapa del online" en js/esc4-game.js) y lo piden acá
         ("esc4-mapa"): el juego se pone de ese tamaño y se lo agranda o achica
         para que entre entero, así los dos juegan con las mismas distancias y
         la misma velocidad. Lo que sobra son franjas de estrellas, sin juego. -->
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }
      #estrellas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #juego {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
      }
      /* Online, con el mapa acordado: de ese tamaño (lo pone el script),
         centrado y escalado a la ventana. */
      #juego.mapa-fijo {
        inset: auto;
        top: 50%;
        left: 50%;
        transform-origin: center;
      }
    </style>
  </head>
  <body>
    <canvas id="estrellas" aria-hidden="true"></canvas>
    <iframe
      id="juego"
      title="Escenario 4"
      allow="autoplay; gamepad; fullscreen"
    ></iframe>
    <script>
      (() => {
        const marco = document.getElementById("juego");
        const lienzo = document.getElementById("estrellas");

        // Lo que venga en la dirección (?servidor=, ?calidad=, ?perf=1) es para
        // el juego. Si a este marco lo tiene el portfolio, el juego se entera
        // con ?embebido=1 (y suma "volver al sitio" al menú).
        const params = new URLSearchParams(location.search);
        if (window.parent !== window) params.set("embebido", "1");
        const q = params.toString();
        marco.src = "juego.html" + (q ? "?" + q : "");

        // Las franjas: estrellas quietas, más o menos tan juntas como las del
        // fondo del juego. Se dibujan una vez (y de nuevo al cambiar el tamaño).
        function dibujarEstrellas() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const w = window.innerWidth;
          const h = window.innerHeight;
          lienzo.width = Math.round(w * dpr);
          lienzo.height = Math.round(h * dpr);
          const ctx = lienzo.getContext("2d");
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.fillStyle = "#fff";
          const cantidad = Math.round((110 * (w * h)) / (1920 * 1080));
          for (let i = 0; i < cantidad; i++) {
            ctx.globalAlpha = 0.3 + Math.random() * 0.6;
            ctx.beginPath();
            ctx.arc(
              Math.random() * w,
              Math.random() * h,
              0.6 + Math.random() * 1.1,
              0,
              Math.PI * 2,
            );
            ctx.fill();
          }
        }

        // mapa: { w, h } online (lo pide el juego), o null: toda la ventana.
        let mapa = null;
        function acomodar() {
          marco.classList.toggle("mapa-fijo", !!mapa);
          if (!mapa) {
            marco.style.removeProperty("width");
            marco.style.removeProperty("height");
            marco.style.removeProperty("transform");
            return;
          }
          // El juego entero adentro de la ventana, centrado y sin deformarse.
          const k = Math.min(
            window.innerWidth / mapa.w,
            window.innerHeight / mapa.h,
          );
          marco.style.width = mapa.w + "px";
          marco.style.height = mapa.h + "px";
          marco.style.transform = `translate(-50%, -50%) scale(${k})`;
        }
        dibujarEstrellas();
        acomodar();
        window.addEventListener("resize", () => {
          dibujarEstrellas();
          acomodar();
        });
        // Cada vez que el juego se recarga (volver al menú) vuelve a ocupar
        // toda la ventana.
        marco.addEventListener("load", () => {
          mapa = null;
          acomodar();
        });

        // El teclado tiene que ir al juego: apenas carga, cuando el portfolio le
        // da el foco a este marco, y si se hace click o se aprieta algo sobre
        // las franjas (ahí el foco queda en el marco).
        // (Al recibir el foco, recién un instante después: pasarlo en el mismo
        // momento en que llega no tiene efecto.)
        const alJuego = () => marco.contentWindow && marco.contentWindow.focus();
        marco.addEventListener("load", alJuego);
        window.addEventListener("focus", () => setTimeout(alJuego, 0));
        window.addEventListener("pointerdown", alJuego);
        // La tecla que llegó acá no se pierde: se le pasa al juego, y las que
        // siguen (y el soltarla) ya le llegan directo.
        window.addEventListener("keydown", (ev) => {
          const doc = marco.contentDocument;
          if (doc)
            doc.dispatchEvent(
              new KeyboardEvent("keydown", {
                key: ev.key,
                code: ev.code,
                repeat: ev.repeat,
                shiftKey: ev.shiftKey,
                bubbles: true,
              }),
            );
          alJuego();
        });

        // Lo que pide el juego: el mapa del online ("esc4-mapa") y "volver al
        // sitio" ("esc4-volver", ver volverAlSitio en js/esc4-game.js), que el
        // marco le pasa al portfolio.
        window.addEventListener("message", (ev) => {
          if (ev.source !== marco.contentWindow) return;
          if (ev.origin !== location.origin) return;
          const m = ev.data || {};
          if (m.tipo === "esc4-mapa" && m.w > 0 && m.h > 0) {
            mapa = { w: Math.round(m.w), h: Math.round(m.h) };
            acomodar();
          } else if (m.tipo === "esc4-volver" && window.parent !== window) {
            window.parent.postMessage(m, location.origin);
          }
        });
      })();
    </script>
  </body>
</html>
