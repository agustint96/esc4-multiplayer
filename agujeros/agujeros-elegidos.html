:root {
  --fondo: #0a0c11;
  --texto: #f0ece4;
  --tenue: rgba(240, 236, 228, .62);
  --acento: #f19280;
  --linea: rgba(126, 184, 201, .16);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--fondo); }
body { background: var(--fondo); color: var(--texto); font-family: "Segoe UI", system-ui, sans-serif; padding: 34px 48px 60px; max-width: 1360px; margin: 0 auto; }
h1 { font-family: Spaceport; font-weight: 400; font-size: 44px; letter-spacing: .5px; }
.bajada { margin-top: 10px; font-size: 16px; line-height: 1.45; color: var(--tenue); max-width: 1100px; }
.controles { display: flex; flex-wrap: wrap; gap: 14px 30px; margin: 22px 0 28px; }
.grupo { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.grupo > span { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--acento); margin-right: 4px; }
.grupo button { background: none; border: 1px solid var(--linea); color: var(--tenue); font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
.grupo button:hover { color: var(--texto); }
.grupo button[aria-pressed="true"] { border-color: var(--acento); color: var(--texto); background: rgba(241, 146, 128, .12); }
.grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px 22px; }
.tarjeta canvas { display: block; width: 100%; aspect-ratio: 1; outline: 1px solid var(--linea); }
.nombre { font-family: Spaceport; font-size: 21px; margin-top: 12px; white-space: pre; }
.origen { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--acento); margin-top: 5px; }
.nota { font-size: 14.5px; line-height: 1.45; color: var(--tenue); margin-top: 6px; }
@media (max-width: 600px) {
  body { padding: 24px 16px 40px; }
  h1 { font-size: 30px; }
}
</style>
</head>
<body>
<h1>agujeros elegidos</h1>
<p class="bajada">Los nueve que elegiste, juntos y en movimiento. Todos más o menos del tamaño del agujero de hoy, con los colores de hoy: blanco al principio de la partida y naranja más adelante. Cada uno está hecho con el código de su maqueta.</p>

const TAU = Math.PI * 2;
const DPR = Math.min(2, window.devicePixelRatio || 1);
function azar(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const rgba = (c, a) => `rgba(${Math.round(cl(c[0], 0, 255))},${Math.round(cl(c[1], 0, 255))},${Math.round(cl(c[2], 0, 255))},${cl(a).toFixed(4)})`;
const mezcla = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
const BLANCO = [255, 255, 255];
function lienzo(w, h = w) {
  const cv = document.createElement("canvas");
  cv.width = w;
  cv.height = h;
  return cv;
}
// Un normal al azar (Box-Muller), para repartir puntos en una esfera.
function normal(r) {
  return Math.sqrt(-2 * Math.log(1 - r())) * Math.cos(TAU * r());
}

// El latido (pulsoCumulo): una vez por compás, sube rápido y baja despacio.
const COMPAS = 2.0604; // MUSICA_COMPAS_RESPALDO
const TIEMPO = COMPAS / 5; // MUSICA_TIEMPOS_COMPAS
const PULSO_AMPLITUD = 1.4 / 1.15 - 1; // CUMULO_PULSO_AMPLITUD
function pulso(t) {
  const u = (t % COMPAS) / (1.25 * TIEMPO);
  if (u >= 1) return 0;
  const s = u < 0.25 ? u / 0.25 : 1 - (u - 0.25) / 0.75;
  return s * s * (3 - 2 * s);
}

// --- El agujero de hoy (esc4-game.js), en px del mundo ------------------------
const ANILLO = 32; // CUMULO_ANILLO
const ESTRELLA_R = 3.4; // CUMULO_ESTRELLA_R
const DISCO = ANILLO * 1.15; // CUMULO_ANILLO * CUMULO_DISCO_RADIO
const GIRO = 9; // CUMULO_GIRO
const K = 4; // SPRITE_ESCALA

// armarAnillo: las estrellas del anillo con su brillo, en un sprite.
function armarAnillo(radio, cant, r, color) {
  const brillo = 12; // CUMULO_BRILLO
  const lado = Math.ceil((radio + r + brillo * 2) * 2 * K);
  const cv = lienzo(lado);
  const c = cv.getContext("2d");
  c.translate(lado / 2, lado / 2);
  c.fillStyle = c.shadowColor = color;
  c.shadowBlur = brillo * K;
  for (let i = 0; i < cant; i++) {
    const a = (i / cant) * TAU;
    for (let k = 0; k < 3; k++) {
      c.beginPath();
      c.arc(Math.cos(a) * radio * K, Math.sin(a) * radio * K, r * K, 0, TAU);
      c.fill();
    }
  }
  return cv;
}
const SPRITES = {};
function anillos(pal) {
  const clave = "anillo" + pal.col;
  if (!SPRITES[clave]) {
    const color = rgba(pal.col, 1);
    SPRITES[clave] = {
      afuera: armarAnillo(ANILLO, 28, ESTRELLA_R, color),
      adentro: armarAnillo(ANILLO * 0.72, 14, ESTRELLA_R * 0.75, color),
    };
  }
  return SPRITES[clave];
}
function dibujarAnillo(c, sprite, giro) {
  const lado = sprite.width / K;
  c.save();
  c.globalCompositeOperation = "lighter";
  c.rotate(giro);
  c.drawImage(sprite, -lado / 2, -lado / 2, lado, lado);
  c.restore();
}
function anillosDeHoy(c, t, pal) {
  const s = anillos(pal);
  dibujarAnillo(c, s.afuera, t * GIRO);
  dibujarAnillo(c, s.adentro, -t * GIRO * 1.7);
}
function disco(c, r, color = "#000") {
  c.fillStyle = color;
  c.beginPath();
  c.arc(0, 0, r, 0, TAU);
  c.fill();
}
// Oscurece alrededor (se come la luz de al lado).
function sombra(c, r, a) {
  const g = c.createRadialGradient(0, 0, 0, 0, 0, r);
  g.addColorStop(0, `rgba(0,0,0,${a})`);
  g.addColorStop(0.55, `rgba(0,0,0,${a * 0.6})`);
  g.addColorStop(1, "rgba(0,0,0,0)");
  c.fillStyle = g;
  c.beginPath();
  c.arc(0, 0, r, 0, TAU);
  c.fill();
}
// Un aro de luz: varias pasadas, de la más ancha y tenue a la más fina.
function aro(c, r, color, pasadas) {
  c.save();
  c.globalCompositeOperation = "lighter";
  c.strokeStyle = rgba(color, 1);
  for (const [ancho, a] of pasadas) {
    c.globalAlpha = a;
    c.lineWidth = ancho;
    c.beginPath();
    c.arc(0, 0, r, 0, TAU);
    c.stroke();
  }
  c.restore();
}

// --- Estrellas de las esferas (esferas_estrellas.py) ---------------------------
// Cada estrella: un punto con un halo suave (el "estampar" de la maqueta). Se
// arman en sprites, uno por nivel de brillo, del apagado al más prendido.
const NIVELES = 12;
const NUCLEO = 8; // px del sprite: el radio del punto (el sprite mide 16 radios)
function colorNivel(pal, u) {
  const m = Math.min(1, u);
  return pal.dim.map((d, i) => d * (1 - m) + pal.luz[i] * m + pal.pico[i] * Math.max(0, u - 0.85) * 1.5);
}
function estrellas(pal) {
  const clave = "estrellas" + pal.col;
  if (SPRITES[clave]) return SPRITES[clave];
  const lista = [];
  for (let i = 0; i < NIVELES; i++) {
    const u = (i / (NIVELES - 1)) * 1.3;
    const col = colorNivel(pal, u);
    const n = NUCLEO * 16;
    const cv = lienzo(n);
    const c = cv.getContext("2d");
    const sig = 2.4 * NUCLEO;
    const g = c.createRadialGradient(n / 2, n / 2, 0, n / 2, n / 2, n / 2);
    for (let k = 0; k <= 8; k++) {
      const x = (k / 8) * (n / 2);
      g.addColorStop(k / 8, rgba(col, 0.16 * Math.exp(-(x * x) / (2 * sig * sig)) * (k === 8 ? 0 : 1)));
    }
    c.fillStyle = g;
    c.fillRect(0, 0, n, n);
    c.fillStyle = rgba(col, 1);
    c.beginPath();
    c.arc(n / 2, n / 2, NUCLEO, 0, TAU);
    c.fill();
    lista.push({ cv, col: rgba(col, 1) });
  }
  // El destello de las más prendidas: una cruz finita.
  const n = 128, cv = lienzo(n), c = cv.getContext("2d");
  const im = c.createImageData(n, n);
  const pico = pal.pico, largo = 60, ancho = 2.3;
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      const dx = x + 0.5 - n / 2, dy = y + 0.5 - n / 2;
      const brazo = (a, b) => Math.exp(-(b * b) / (2 * ancho * ancho)) * Math.pow(cl(1 - Math.abs(a) / largo), 2);
      const v = cl(brazo(dx, dy) + brazo(dy, dx));
      const o = (y * n + x) * 4;
      im.data[o] = pico[0];
      im.data[o + 1] = pico[1];
      im.data[o + 2] = pico[2];
      im.data[o + 3] = Math.round(255 * v);
    }
  }
  c.putImageData(im, 0, 0);
  SPRITES[clave] = { niveles: lista, destello: cv };
  return SPRITES[clave];
}
function estampar(c, sp, x, y, rad, u, alfa, destello) {
  const nivel = sp.niveles[Math.round((cl(u, 0, 1.3) / 1.3) * (NIVELES - 1))];
  c.globalAlpha = cl(alfa);
  c.drawImage(nivel.cv, x - 8 * rad, y - 8 * rad, 16 * rad, 16 * rad);
  if (destello > 0) {
    const l = 4.5 * rad * (1 + 2 * destello) * (64 / 60);
    c.globalAlpha = 0.8 * destello;
    c.drawImage(sp.destello, x - l, y - l, 2 * l, 2 * l);
  }
}

// El eje de giro de las esferas: inclinado hacia quien mira y un poco torcido.
const INCLINA = 0.45, TUERCE = 0.35;
const LUZ = (() => { const l = [-0.45, -0.6, 0.66], n = Math.hypot(...l); return l.map((v) => v / n); })();
function girar(p, phi) {
  const c = Math.cos(phi), s = Math.sin(phi);
  const x1 = p[0] * c + p[2] * s, z1 = -p[0] * s + p[2] * c;
  const ca = Math.cos(INCLINA), sa = Math.sin(INCLINA);
  const y2 = p[1] * ca - z1 * sa, z2 = p[1] * sa + z1 * ca;
  const cb = Math.cos(TUERCE), sb = Math.sin(TUERCE);
  return [x1 * cb - y2 * sb, x1 * sb + y2 * cb, z2];
}
function enEsfera(r) {
  const v = [normal(r), normal(r), normal(r)], n = Math.hypot(...v) || 1;
  return v.map((x) => x / n);
}
// Los puntos de cada diseño (A, C y F de la maqueta).
const PUNTOS = {
  A: (() => { const r = azar(1); return Array.from({ length: 340 }, () => ({ p: enEsfera(r), b: 0.35 + 0.65 * r(), s: 0.8 + 0.5 * r() })); })(),
  C: (() => { const r = azar(3); return Array.from({ length: 170 }, () => ({ p: enEsfera(r), b: 0.4 + 0.6 * r(), s: 0.8 + 0.4 * r(), largo: 0.35 + 0.45 * r() })); })(),
  F: (() => {
    const r = azar(6);
    return Array.from({ length: 520 }, () => {
      const d = enEsfera(r), k = Math.pow(r(), 0.75);
      return { p: d.map((v) => v * k), b: 0.3 + 0.7 * r(), s: 0.6 + 0.4 * r() };
    });
  })(),
};
const ESFERA_R = 44; // ESFERA_RADIO
const ESFERA_VEL = 9 * 0.144; // CUMULO_GIRO * ESFERA_GIRO: ~1,3 rad/s

function esferaDeEstrellas(c, t, pal, dis) {
  const Rs = ESFERA_R;
  // Transparente: el fondo apenas más oscuro y un borde de luz muy suave.
  disco(c, Rs, "rgba(0,0,0,0.1)");
  c.save();
  c.globalCompositeOperation = "lighter";
  const g = c.createRadialGradient(0, 0, 0, 0, 0, Rs * 1.1);
  g.addColorStop(0, rgba(pal.luz, 0));
  g.addColorStop(0.72, rgba(pal.luz, 0.005));
  g.addColorStop(0.88, rgba(pal.luz, 0.03));
  g.addColorStop(0.91, rgba(pal.luz, 0.07));
  g.addColorStop(0.96, rgba(pal.luz, 0.02));
  g.addColorStop(1, rgba(pal.luz, 0));
  c.fillStyle = g;
  c.beginPath();
  c.arc(0, 0, Rs * 1.1, 0, TAU);
  c.fill();
  c.restore();
  const sp = estrellas(pal);
  const phi = t * ESFERA_VEL;
  const lista = PUNTOS[dis].map((q) => {
    const [x, y, z] = girar(q.p, phi);
    const nrm = Math.hypot(x, y, z) + 1e-6;
    const frente = dis === "F" ? (z + 1) / 2 : (z / nrm + 1) / 2;
    const luz = 0.75 + 0.5 * Math.max(0, (x * LUZ[0] + y * LUZ[1] + z * LUZ[2]) / nrm);
    const B = q.b * (0.18 + 0.82 * Math.pow(frente, 1.3)) * luz;
    return { q, x, y, z, B, rad: q.s * (0.4 + 0.55 * frente) };
  });
  lista.sort((a, b) => a.z - b.z);
  const capa = (atras) => {
    if (dis === "C") {
      // Las estelas: para atrás en el giro, apagándose.
      c.save();
      c.globalCompositeOperation = "lighter";
      c.lineCap = "round";
      c.lineWidth = 1.1;
      for (const e of lista) {
        if (e.z < 0 !== atras) continue;
        const m = 10;
        c.strokeStyle = sp.niveles[Math.round((cl(e.B, 0, 1.3) / 1.3) * (NIVELES - 1))].col;
        let prev = [e.x, e.y];
        for (let j = 1; j <= m; j++) {
          const s = j / m;
          const [xs, ys, zs] = girar(e.q.p, phi - s * e.q.largo);
          c.globalAlpha = cl(0.75 * Math.pow(1 - s, 1.5) * (0.35 + 0.65 * (zs + 1) / 2) * Math.min(1, e.B));
          c.beginPath();
          c.moveTo(prev[0] * Rs, prev[1] * Rs);
          c.lineTo(xs * Rs, ys * Rs);
          c.stroke();
          prev = [xs, ys];
        }
      }
      c.restore();
    }
    for (const e of lista) {
      if (e.z < 0 !== atras) continue;
      estampar(c, sp, e.x * Rs, e.y * Rs, e.rad, e.B, 0.25 + 0.75 * e.B, Math.max(0, (e.B - 1) / 0.3));
    }
    c.globalAlpha = 1;
  };
  capa(true);
  capa(false);
}

// --- La esfera del resplandor (el juego de ayer, resplandor.template.html) -----
const HALO_PUNTOS = (() => {
  const r = azar(77), lista = [];
  for (let i = 0; i < 240; i++) {
    let dx, dy, dz, n;
    do { dx = r() * 2 - 1; dy = r() * 2 - 1; dz = r() * 2 - 1; n = Math.hypot(dx, dy, dz); } while (n > 1 || n < 0.1);
    lista.push({ d: [dx / n, dy / n, dz / n], brillo: 0.35 + 0.65 * r(), tam: 0.48 * (0.8 + 0.5 * r()) });
  }
  return lista;
})();
function esferaDeAyer(c, R, pal, ang) {
  const g = c.createRadialGradient(0, 0, 0, 0, 0, R * 1.1);
  g.addColorStop(0, "rgba(0,0,0,0.1)");
  g.addColorStop(0.72, "rgba(0,0,0,0.1)");
  g.addColorStop(0.86, rgba(pal.luz, 0.03));
  g.addColorStop(0.91, rgba(pal.luz, 0.12));
  g.addColorStop(1, rgba(pal.luz, 0));
  c.fillStyle = g;
  c.beginPath();
  c.arc(0, 0, R * 1.1, 0, TAU);
  c.fill();
  const cf = Math.cos(ang), sf = Math.sin(ang), ci = Math.cos(0.45), si = Math.sin(0.45), ct = Math.cos(1.3), st = Math.sin(1.3);
  const esc = R / 32;
  const lista = HALO_PUNTOS.map(({ d, brillo, tam }) => {
    const x1 = d[0] * cf + d[2] * sf, z1 = -d[0] * sf + d[2] * cf;
    const y2 = d[1] * ci - z1 * si, z2 = d[1] * si + z1 * ci;
    const sx = x1 * ct - y2 * st, sy = x1 * st + y2 * ct;
    const frente = (z2 + 1) / 2;
    const luz = 0.75 + 0.5 * Math.max(0, sx * LUZ[0] + sy * LUZ[1] + z2 * LUZ[2]);
    const B = 1.25 * brillo * (0.3 + 0.7 * Math.pow(frente, 1.3)) * luz;
    return { x: sx * R, y: sy * R, z: z2, u: Math.min(1.3, B) / 1.3, rad: Math.max(0.45, tam * (0.4 + 0.55 * frente) * esc) };
  });
  lista.sort((a, b) => a.z - b.z);
  for (const e of lista) {
    const col = e.u < 0.55 ? mezcla(pal.dim, pal.luz, e.u / 0.55) : mezcla(pal.luz, pal.pico, (e.u - 0.55) / 0.45);
    const a = 0.35 + 0.65 * e.u;
    if (e.u > 0.6) {
      c.fillStyle = rgba(col, 0.2 * a);
      c.beginPath(); c.arc(e.x, e.y, e.rad * 2.2, 0, TAU); c.fill();
    }
    c.fillStyle = rgba(col, a);
    c.beginPath(); c.arc(e.x, e.y, e.rad, 0, TAU); c.fill();
  }
}
// La luz de la nave, pero arrancando en el borde y apagándose hacia afuera.
function haloAfuera(c, R0, R1, col, a) {
  const f = R0 / R1, resto = 1 - f;
  const g = c.createRadialGradient(0, 0, 0, 0, 0, R1);
  g.addColorStop(0, rgba(col, 0));
  g.addColorStop(f * 0.82, rgba(col, 0));
  g.addColorStop(f, rgba(col, a));
  g.addColorStop(f + resto * 0.2, rgba(col, 0.65 * a));
  g.addColorStop(f + resto * 0.5, rgba(col, 0.25 * a));
  g.addColorStop(1, rgba(col, 0));
  c.fillStyle = g;
  c.beginPath();
  c.arc(0, 0, R1, 0, TAU);
  c.fill();
}

// --- El horizonte y el hiperespacio (ocho alternativas) -----------------------
const HORIZONTE = (() => {
  const r = azar(91), arco = [], disco = [];
  for (let i = 0; i < 300; i++) arco.push({ a: r() * TAU, u: Math.pow(r(), 1.5), al: 0.45 + 0.55 * r() });
  for (let i = 0; i < 420; i++) {
    const u = Math.pow(r(), 1.35);
    disco.push({ a: r() * TAU, u, al: (0.25 + 0.75 * (1 - u)) * (0.5 + 0.5 * r()) });
  }
  return { arco, disco };
})();
function horizonte(c, t, pal) {
  const Rh = ANILLO * 0.78;
  // Un brillo suave alrededor.
  const g = c.createRadialGradient(0, 0, Rh, 0, 0, Rh * 3.4);
  g.addColorStop(0, rgba(pal.col, 0.16));
  g.addColorStop(1, rgba(pal.col, 0));
  c.fillStyle = g;
  c.beginPath(); c.arc(0, 0, Rh * 3.4, 0, TAU); c.fill();
  c.save();
  c.globalCompositeOperation = "lighter";
  c.lineCap = "round";
  // El arco doblado: más grueso arriba, finito abajo.
  c.strokeStyle = rgba(mezcla(pal.col, BLANCO, 0.25), 1);
  for (const p of HORIZONTE.arco) {
    const a = p.a + t * 0.6;
    const arriba = Math.max(0, -Math.sin(a)), abajo = Math.max(0, Math.sin(a));
    const d = Rh * 1.07 + Rh * (0.1 + 0.55 * arriba * arriba + 0.1 * abajo) * p.u;
    const al = (0.3 + 0.7 * (1 - p.u)) * p.al * (0.6 + 0.4 * Math.cos(a + 0.4));
    const l = 2.2 / d;
    for (const [ancho, k] of [[1.8, 0.25], [0.6, 1]]) {
      c.globalAlpha = cl(al * k);
      c.lineWidth = ancho;
      c.beginPath(); c.arc(0, 0, d, a - l, a + l); c.stroke();
    }
  }
  // El disco: chato e inclinado; gira más rápido cerca del negro.
  const k = 0.19, inc = -0.16, ci = Math.cos(inc), si = Math.sin(inc);
  const pos = (d, a) => {
    const px = d * Math.cos(a), py = d * Math.sin(a) * k;
    return [px * ci - py * si, px * si + py * ci];
  };
  const discoDe = (atras) => {
    c.strokeStyle = rgba(mezcla(pal.col, BLANCO, 0.2), 1);
    for (const p of HORIZONTE.disco) {
      const d = Rh * 1.32 + Rh * 1.9 * p.u;
      const a = p.a + t * 1.1 * Math.pow((Rh * 1.32) / d, 1.5);
      if (Math.sin(a) < 0 !== atras) continue;
      const dop = 0.45 + 0.55 * (0.5 + 0.5 * Math.cos(a + 0.3));
      const l = 3.2 / d;
      const [x1, y1] = pos(d, a - l), [x2, y2] = pos(d, a + l);
      for (const [ancho, kk] of [[2, 0.25], [0.7, 1]]) {
        c.globalAlpha = cl(p.al * dop * kk);
        c.lineWidth = ancho;
        c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
      }
    }
  };
  discoDe(true);
  c.restore();
  disco(c, Rh);
  aro(c, Rh * 1.03, mezcla(pal.col, BLANCO, 0.4), [[4, 0.12], [2, 0.3], [0.8, 1]]);
  c.save();
  c.globalCompositeOperation = "lighter";
  c.lineCap = "round";
  discoDe(false);
  c.restore();
}

const RAYAS = (() => {
  const r = azar(55);
  return Array.from({ length: 120 }, () => ({ a: r() * TAU, fase: r(), vel: 0.35 + 0.35 * r(), l: r(), b: 0.5 + 0.5 * r() }));
})();
function hiperespacio(c, t, pal) {
  const R = DISCO;
  sombra(c, R * 1.8, 0.5);
  disco(c, R);
  const vp = { x: R * 0.1, y: -R * 0.07 };
  // Un resplandor chiquito en el fondo del túnel.
  const g = c.createRadialGradient(vp.x, vp.y, 0, vp.x, vp.y, R * 0.3);
  g.addColorStop(0, rgba(mezcla(pal.col, BLANCO, 0.5), 0.45));
  g.addColorStop(1, rgba(pal.col, 0));
  c.fillStyle = g;
  c.beginPath(); c.arc(vp.x, vp.y, R * 0.3, 0, TAU); c.fill();
  c.save();
  c.beginPath(); c.arc(0, 0, R * 0.985, 0, TAU); c.clip();
  c.globalCompositeOperation = "lighter";
  c.lineCap = "round";
  const col = mezcla(pal.col, BLANCO, 0.35);
  for (const s of RAYAS) {
    const u = (s.fase + t * s.vel) % 1;
    const cabeza = R * (0.06 + 1.1 * Math.pow(u, 1.7));
    const cola = cabeza * (1 - (0.25 + 0.5 * s.l));
    const x1 = vp.x + Math.cos(s.a) * cola, y1 = vp.y + Math.sin(s.a) * cola;
    const x2 = vp.x + Math.cos(s.a) * cabeza, y2 = vp.y + Math.sin(s.a) * cabeza;
    const lg = c.createLinearGradient(x1, y1, x2, y2);
    const al = (0.25 + 0.75 * Math.min(1, cabeza / R)) * s.b * Math.min(1, u / 0.12);
    lg.addColorStop(0, rgba(col, 0));
    lg.addColorStop(1, rgba(col, al));
    c.strokeStyle = lg;
    c.lineWidth = 0.25 + 1.1 * Math.min(1, cabeza / R);
    c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
  }
  c.restore();
  aro(c, R, pal.col, [[6, 0.1], [3, 0.3], [1.5, 1]]);
}

// --- El otro lado (el agujero de hoy - cinco propuestas) ----------------------
const OTRO_CIELO = (() => {
  const r = azar(505);
  return Array.from({ length: 120 }, () => ({ x: r() * 2 - 1, y: r() * 2 - 1, a: 0.18 + 0.4 * r(), rad: 0.35 + 0.45 * r() }));
})();
function otroLado(c, t, pal, p) {
  const R = DISCO;
  disco(c, R);
  c.save();
  c.beginPath(); c.arc(0, 0, R * 0.98, 0, TAU); c.clip();
  // El otro cielo se corre distinto que todo lo demás, como mirando por una ventana.
  const dx = Math.sin(t * 0.3) * R * 0.15, dy = Math.cos(t * 0.23) * R * 0.1;
  const prende = 1 + 0.6 * p;
  const g = c.createRadialGradient(R * 0.25 + dx, -R * 0.2 + dy, 0, R * 0.25 + dx, -R * 0.2 + dy, R * 1.1);
  g.addColorStop(0, `rgba(96,64,170,${0.22 * prende})`);
  g.addColorStop(0.5, `rgba(40,40,120,${0.1 * prende})`);
  g.addColorStop(1, "rgba(0,0,0,0)");
  c.fillStyle = g;
  c.fillRect(-R, -R, 2 * R, 2 * R);
  for (const e of OTRO_CIELO) {
    c.fillStyle = `rgba(185,195,255,${e.a * Math.min(1, prende)})`;
    c.beginPath(); c.arc(e.x * R * 1.3 + dx, e.y * R * 1.3 + dy, e.rad, 0, TAU); c.fill();
  }
  c.restore();
  anillosDeHoy(c, t, pal);
}

// --- Los tiles ----------------------------------------------------------------
const tiles = [];
function armarTiles() {
  const grilla = document.getElementById("grilla");
  DISENOS.forEach((d, i) => {
    const tarjeta = document.createElement("div");
    tarjeta.className = "tarjeta";
    const cv = document.createElement("canvas");
    tarjeta.appendChild(cv);
    for (const [cls, txt] of [["nombre", d.nombre], ["origen", d.origen], ["nota", d.nota]]) {
      const el = document.createElement("div");
      el.className = cls;
      el.textContent = txt;
      tarjeta.appendChild(el);
    }
    grilla.appendChild(tarjeta);
    tiles.push({ d, cv, c: cv.getContext("2d"), semilla: 20 + i, W: 0, fondo: null, visible: true });
  });
  const ro = new ResizeObserver(() => {
    tiles.forEach(medir);
    if (T_FIJO !== null) tiles.forEach((tl) => pintar(tl, T_FIJO));
  });
  tiles.forEach((tl) => ro.observe(tl.cv));
  if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver((es) => {
      for (const e of es) {
        const tl = tiles.find((x) => x.cv === e.target);
        if (tl) tl.visible = e.isIntersecting;
      }
    });
    tiles.forEach((tl) => io.observe(tl.cv));
  }
}
function medir(tl) {
  const W = Math.round(tl.cv.clientWidth * DPR);
  if (!W || W === tl.W) return;
  tl.W = tl.cv.width = tl.cv.height = W;
  tl.fondo = null;
  tl.aux = null;
}
// El fondo: al principio, la hoja casi negra; más adelante, el papel azul.
// Como en la maqueta del rasgado: el papel mezclado con el azul oscuro.
function armarFondo(tl) {
  const W = tl.W, cv = lienzo(W), c = cv.getContext("2d");
  const fin = E.momento === "fin";
  c.fillStyle = "rgb(9,12,19)";
  c.fillRect(0, 0, W, W);
  const im = IMG.fondo, r = azar(tl.semilla * 7 + 3), sw = im.width * 0.3;
  c.globalAlpha = fin ? 0.85 : 0.13;
  c.drawImage(im, r() * (im.width - sw), r() * (im.height - sw), sw, sw, 0, 0, W, W);
  c.globalAlpha = 1;
  const s = W / 360, n = 150;
  for (let i = 0; i < n * 4; i++) {
    const chica = i >= n, q = r();
    c.fillStyle = `rgba(230,242,255,${chica ? 0.08 + 0.14 * r() : 0.4 + 0.6 * r()})`;
    c.beginPath();
    c.arc(r() * W, r() * W, (chica ? 0.55 : 0.5 + q * q * q * 1.3) * s * 0.5, 0, TAU);
    c.fill();
  }
  tl.fondo = cv;
  tl.fondoDe = E.momento;
}
// La nave, como en el juego: la caja de 130 px (el dibujo mide ~86 de largo).
// Al principio de la partida, en blanco y negro.
function nave(c, pal) {
  const im = IMG.cohete, k = 130 / im.height;
  if (!SPRITES.naveGris) {
    const cv = lienzo(im.width, im.height), g = cv.getContext("2d");
    g.filter = "grayscale(1) brightness(0.8)";
    g.drawImage(im, 0, 0);
    SPRITES.naveGris = cv;
  }
  c.save();
  c.translate(-118, 14);
  c.rotate(Math.PI / 2);
  c.drawImage(pal.fin ? im : SPRITES.naveGris, (-im.width * k) / 2, (-im.height * k) / 2, im.width * k, im.height * k);
  c.restore();
}
// El rasgado es una imagen (se armó con el código de su maqueta). Para el
// latido, el centro se dibuja otra vez agrandado y se funde con el resto.
function rasgado(tl, pal, kv, esc) {
  const { c, W } = tl;
  const img = IMG[`rasgado-${E.vista}-${pal.fin ? "papel" : "oscuro"}`];
  c.drawImage(img, 0, 0, W, W);
  if (esc < 1.001) return;
  if (!tl.aux) tl.aux = lienzo(W);
  const o = tl.aux.getContext("2d");
  o.setTransform(1, 0, 0, 1, 0, 0);
  o.globalCompositeOperation = "source-over";
  o.clearRect(0, 0, W, W);
  o.translate(W / 2, W / 2);
  o.scale(esc, esc);
  o.drawImage(img, -W / 2, -W / 2, W, W);
  o.setTransform(1, 0, 0, 1, 0, 0);
  const R0 = (32 * kv * W) / 360;
  const g = o.createRadialGradient(W / 2, W / 2, R0 * 1.3 * esc, W / 2, W / 2, R0 * 1.8 * esc);
  g.addColorStop(0, "rgba(0,0,0,1)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  o.globalCompositeOperation = "destination-in";
  o.fillStyle = g;
  o.fillRect(0, 0, W, W);
  c.drawImage(tl.aux, 0, 0);
}

function pintar(tl, t) {
  const { c, W, d } = tl;
  if (!W) return;
  const pal = PALETAS[E.momento] || PALETAS.inicio;
  const kv = VISTAS[E.vista] || 2;
  const p = E.latido === "si" ? pulso(t) : 0;
  const esc = 1 + PULSO_AMPLITUD * p;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalAlpha = 1;
  c.globalCompositeOperation = "source-over";
  if (d.imagen) rasgado(tl, pal, kv, esc);
  else {
    if (!tl.fondo || tl.fondoDe !== E.momento) armarFondo(tl);
    c.drawImage(tl.fondo, 0, 0);
  }
  const k = (W / 360) * kv;
  c.setTransform(k, 0, 0, k, W / 2, W / 2);
  if (!d.imagen) {
    c.save();
    c.scale(esc, esc);
    d.dibujar(c, t, pal, p);
    c.restore();
  }
  c.globalAlpha = 1;
  c.globalCompositeOperation = "source-over";
  if (E.vista === "escala") nave(c, pal);
}

// --- Los botones ----------------------------------------------------------------
function marcar() {
  for (const g of document.querySelectorAll(".grupo")) {
    for (const b of g.querySelectorAll("button")) b.setAttribute("aria-pressed", String(E[g.dataset.clave] === b.dataset.valor));
  }
}
document.querySelector(".controles").addEventListener("click", (ev) => {
  const b = ev.target.closest("button");
  if (!b) return;
  E[b.closest(".grupo").dataset.clave] = b.dataset.valor;
  try { localStorage.setItem(GUARDADO, JSON.stringify(E)); } catch (e) {}
  marcar();
  if (T_FIJO !== null) tiles.forEach((tl) => pintar(tl, T_FIJO));
});

// --- Andando ----------------------------------------------------------------------
let t = 0, antes = null;
function cuadro(ahora) {
  const dt = antes === null ? 0 : Math.min(0.1, (ahora - antes) / 1000);
  antes = ahora;
  t += dt * (E.velocidad === "lenta" ? 0.2 : 1);
  for (const tl of tiles) if (tl.visible) pintar(tl, t);
  requestAnimationFrame(cuadro);
}
Promise.all(CARGAS).then(() => {
  armarTiles();
  marcar();
  tiles.forEach(medir);
  if (T_FIJO !== null) {
    tiles.forEach((tl) => pintar(tl, T_FIJO));
    return;
  }
  requestAnimationFrame(cuadro);
});
</script>
